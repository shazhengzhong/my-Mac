<div
  class="practice-sentence"
  id="sentence-{{ sentence.id }}"
  data-sentence-row
>
  <p class="bilingual-en practice-en" lang="en">
    {% include "diaries/_word_line.html" with sentence=sentence word_class="practice-word" %}
  </p>

  <div class="sentence-actions practice-controls">
    <div
      class="diary-read-controls"
      data-diary-read-control
      data-sentence-id="{{ sentence.id }}"
      data-normal-url="{% url 'sentence_tts' sentence.id 'normal' %}"
      data-slow-url="{% url 'sentence_tts' sentence.id 'normal' %}"
      data-slow-playback-rate="0.8"
    >
      <button class="diary-read-button" type="button" data-diary-read-speed="normal" aria-label="正常朗读这一句">正常</button>
      <button class="diary-read-button" type="button" data-diary-read-speed="slow" aria-label="慢速朗读这一句">慢读</button>
      <span class="diary-read-status" role="status" aria-live="polite"></span>
    </div>

    <div
      class="record-control"
      data-record-control
      data-upload-url="{% url 'upload_recording' sentence.id %}"
    >
      <button
        class="icon-button js-record-button"
        type="button"
        aria-label="开始录音"
        title="我的录音"
      >
        <svg class="icon icon-mic" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"></rect>
          <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M9 21h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
        </svg>
        <span class="button-label sr-only">我的录音</span>
      </button>
      <span class="record-status" role="status" aria-live="polite"></span>
    </div>
  </div>

  {% if sentence.recordings.all %}
    <details class="recording-history" data-recording-history>
      <summary>
        我的录音
        <span data-recording-count>{{ sentence.recordings.count }}</span>
      </summary>
      <div class="recording-list">
        {% for recording in sentence.recordings.all %}
          <div class="recording-item" data-recording-item>
            <div class="recording-meta">
              <span class="muted small">{{ recording.created_at|date:"m-d H:i" }}</span>
              <button
                class="recording-delete"
                type="button"
                data-delete-recording
                data-delete-url="{% url 'delete_recording' recording.id %}"
                aria-label="删除这条录音"
                title="删除这条录音"
              >删除</button>
            </div>
            <audio controls preload="none" src="{% url 'serve_audio_asset' recording.audio_id %}"></audio>
          </div>
        {% endfor %}
      </div>
    </details>
  {% endif %}
</div>
