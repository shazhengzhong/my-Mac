{% for segment in sentence.display_segments %}{% if segment.token %}<button type="button" class="karaoke-word word-card-trigger{% if word_class %} {{ word_class }}{% endif %}" data-word-card-url="{% url 'word_card' segment.token.id %}" aria-haspopup="dialog" aria-expanded="false" aria-label="查看 {{ segment.display_word }} 的释义">{{ segment.display_word }}</button>{% else %}<span class="karaoke-word{% if word_class %} {{ word_class }}{% endif %}">{{ segment.display_word }}</span>{% endif %}{% if not forloop.last %} {% endif %}{% endfor %}
