{% extends "base.html" %}
{% block title %}修改密码 · 英语口语练习{% endblock %}
{% block content %}
  <section class="card narrow">
    <p class="eyebrow">账号安全</p>
    <h1>修改密码</h1>
    <p class="lead">修改成功后，其他设备上的登录会失效。你当前使用的设备会保持登录。</p>

    <form method="post" action="{% url 'password_change' %}">
      {% csrf_token %}
      {% include "accounts/_form_fields.html" %}
      <button class="button" type="submit">保存新密码</button>
    </form>

    <div class="secondary-links">
      <a href="{% url 'account_settings' %}">返回账号设置</a>
    </div>
  </section>
{% endblock %}
