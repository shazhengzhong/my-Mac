{% extends "base.html" %}
{% block title %}恢复账号 · 英语口语练习{% endblock %}
{% block content %}
  <section class="card narrow">
    <p class="eyebrow">不依赖短信或邮箱</p>
    <h1>使用恢复码找回密码</h1>
    <p class="lead">输入你的手机号、一组尚未使用的恢复码，以及新密码。成功后这组恢复码会立即失效。</p>

    <form method="post" action="{% url 'recovery_reset' %}">
      {% csrf_token %}
      {% include "accounts/_form_fields.html" %}
      <button class="button" type="submit">重置密码</button>
    </form>

    <div class="secondary-links">
      <span>想起密码了？</span>
      <a href="{% url 'login' %}">返回登录</a>
    </div>
  </section>
{% endblock %}
